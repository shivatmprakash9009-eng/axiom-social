project_id = "axiom-social"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "axiomsocial://auth/callback"
additional_redirect_urls = ["axiomsocial://auth/callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.rate_limit]
email_sent = 3
sms_sent = 0
verify = 10
token_refresh = 30
sign_in_sign_ups = 30
token_verifications = 30
